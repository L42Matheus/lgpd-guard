name: LGPD Guard — Compliance Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  lgpd-check:
    name: Verificação de Conformidade LGPD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para acessar o histórico do diff

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Cache do ambiente virtual (.venv)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}

      - name: Prepara ambiente Python
        run: |
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi

          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source .venv/bin/activate
          python -m pip install --upgrade pip

          if [ "${{ steps.venv-cache.outputs.cache-hit }}" != "true" ]; then
            pip install -r requirements.txt
          fi

      - name: Gera diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr_diff.txt
          echo "Linhas no diff: $(wc -l < /tmp/pr_diff.txt)"

      - name: Executa análise estática (rápida, sem LLM)
        id: static_analysis
        run: |
          cd lgpd_guard
          set +e
          python main.py \
            --diff /tmp/pr_diff.txt \
            --no-llm \
            --output json > /tmp/static_result.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Executa análise semântica (LLM + RAG)
        id: llm_analysis
        if: ${{ vars.LGPD_LLM_ENABLED == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd lgpd_guard
          set +e
          python main.py \
            --diff /tmp/pr_diff.txt \
            --provider anthropic \
            --post-comment \
            --pr-number ${{ github.event.pull_request.number }} \
            --output text
          set -e

      - name: Posta resultado da análise estática (se LLM desabilitado)
        if: ${{ vars.LGPD_LLM_ENABLED != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd lgpd_guard
          python main.py \
            --diff /tmp/pr_diff.txt \
            --no-llm \
            --post-comment \
            --pr-number ${{ github.event.pull_request.number }} \
            --output text

      - name: Verifica resultado e define status do pipeline
        run: |
          VIOLATIONS=$(cat /tmp/static_result.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          criticals = [v for v in data['violations'] if v['severidade'] in ('CRÍTICA', 'ALTA')]
          print(len(criticals))
          " 2>/dev/null || echo "0")

          echo "Violações críticas/altas: $VIOLATIONS"

          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "❌ LGPD Guard: $VIOLATIONS violação(ões) crítica(s)/alta(s) encontrada(s)."
            echo "   O merge está bloqueado até que as violações sejam corrigidas."
            exit 1
          else
            echo "✅ LGPD Guard: Nenhuma violação crítica encontrada."
          fi
